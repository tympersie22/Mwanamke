name: Security evidence
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p artifacts/security
      - run: npm audit --omit=dev --audit-level=high --json > artifacts/security/npm-audit.json
      - if: always()
        run: npm sbom --sbom-format cyclonedx --omit=dev > artifacts/security/sbom.cdx.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence
          path: artifacts/security
  static-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: bash scripts/release/security-scan-docker.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restricted-security-evidence
          path: artifacts/security
          retention-days: 7
